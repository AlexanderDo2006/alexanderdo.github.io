<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Summer 2026</title>
    <meta name="author" content="Alexander Do">
    <link rel="shortcut icon" href="images/favicon/JHU.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
  </head>

  <body>
    <main class="container container--wide">
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12,19 5,12 12,5"/>
        </svg>
        <span>Back to home</span>
      </a>

      <header class="page-header">
        <h1 class="name">Summer 2026</h1>
        <p class="page-subtitle">Seattle, Washington</p>
      </header>

      <div class="photo-gallery">
        <div class="photo-item"><img src="images/summer2026/img1.jpg" alt="Summer 2026 photo 1"></div>
        <div class="photo-item"><img src="images/summer2026/img2.jpg" alt="Summer 2026 photo 2"></div>
        <div class="photo-item"><img src="images/summer2026/img3.jpg" alt="Summer 2026 photo 3"></div>
        <div class="photo-item"><img src="images/summer2026/img4.jpg" alt="Summer 2026 photo 4"></div>
        <div class="photo-item"><img src="images/summer2026/img5.jpg" alt="Summer 2026 photo 5"></div>
        <div class="photo-item"><img src="images/summer2026/img6.jpg" alt="Summer 2026 photo 6"></div>
        <div class="photo-item"><img src="images/summer2026/img7.jpg" alt="Summer 2026 photo 7"></div>
        <div class="photo-item"><img src="images/summer2026/img8.jpg" alt="Summer 2026 photo 8"></div>
        <div class="photo-item"><img src="images/summer2026/img9.jpg" alt="Summer 2026 photo 9"></div>
        <div class="photo-item"><img src="images/summer2026/img10.jpg" alt="Summer 2026 photo 10"></div>
        <div class="photo-item"><img src="images/summer2026/img11.jpg" alt="Summer 2026 photo 11"></div>
        <div class="photo-item"><img src="images/summer2026/img12.jpg" alt="Summer 2026 photo 12"></div>
        <div class="photo-item"><img src="images/summer2026/img13.jpg" alt="Summer 2026 photo 13"></div>
        <div class="photo-item"><img src="images/summer2026/img14.jpg" alt="Summer 2026 photo 14"></div>
      </div>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <button class="lightbox-close" aria-label="Close photo viewer" type="button">×</button>
      <img class="lightbox-img" alt="">
    </div>

    <script>
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = lightbox.querySelector('.lightbox-img');
      var closeBtn = lightbox.querySelector('.lightbox-close');

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('.photo-item img').forEach(function (img) {
        img.addEventListener('click', function () {
          openLightbox(img.src, img.alt);
        });
      });

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      });
    </script>
  </body>
</html>
