    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <button class="lightbox-close" aria-label="Close photo viewer" type="button">×</button>
      <img class="lightbox-img" alt="">
    </div>

    <script>
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = lightbox.querySelector('.lightbox-img');
      var closeBtn = lightbox.querySelector('.lightbox-close');

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('.photo-item img').forEach(function (img) {
        img.addEventListener('click', function () {
          openLightbox(img.src, img.alt);
        });
      });

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      });
    </script>
  </body>
</html>
